<!doctype html>
<html>
<head>

<body>
  <div class="hero">
    <span class="brand"><img src="../../assets/logo.svg" alt="">GitHub HTML Preview</span>
    <h1>See the page, <em>not the markup</em></h1>

  </div>

    <div class="chrome"><i></i><i></i><i></i><span class="url">github.com/bradtraversy/50projects50days/blob/master/expanding-cards/index.html</span></div>
    <div class="shot" data-src="blob-preview-light" data-crop="330,180,1090,640" data-ring="previewTab" data-ring-pad="1" style="width:1100px"></div>
  </div>
  <script src="shot.js"></script>

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run compile
      - run: pnpm test
      - run: pnpm run test:e2e
      - name: Build stable archive
        run: pnpm run zip
      - name: Install exact stable archive
        run: |
          rm -rf .artifact-extension
          mkdir .artifact-extension
          unzip -q .output/github-html-preview-*-chrome.zip -d .artifact-extension
      - name: Smoke exact stable archive
        env:
          EXTENSION_PATH: ${{ github.workspace }}/.artifact-extension
        run: pnpm exec playwright test --grep "blob preview embeds"
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Upload stable archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-stable-archive
          path: .output/*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  debug-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run zip:debug
      - name: Install exact debug archive
        run: |
          rm -rf .artifact-extension-debug
          mkdir .artifact-extension-debug
          unzip -q .output/github-html-preview-*-chrome-debug.zip -d .artifact-extension-debug
      - name: Smoke exact debug archive
        env:
          EXTENSION_PATH: ${{ github.workspace }}/.artifact-extension-debug
        run: pnpm exec playwright test --grep "blob preview embeds"
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-debug-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Upload debug archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-debug-archive
          path: .output/*-chrome-debug.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

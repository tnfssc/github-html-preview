name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.3

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Type-check
        run: pnpm run compile

      - name: Run unit and manifest contracts
        run: pnpm test

      - name: Run deterministic extension E2E
        run: pnpm run test:e2e

      - name: Verify release version contract
        run: node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"

      - name: Build stable release archive
        if: ${{ !contains(github.ref_name, '-') }}
        run: pnpm run zip

      - name: Build diagnostic prerelease archive
        if: ${{ contains(github.ref_name, '-debug.') }}
        run: |
          pnpm run zip:debug
          mv .output/github-html-preview-*-chrome-debug.zip \
            ".output/github-html-preview-${GITHUB_REF_NAME#v}-chrome.zip"

      - name: Install exact release archive
        run: |
          rm -rf .artifact-extension
          mkdir .artifact-extension
          unzip -q .output/*-chrome.zip -d .artifact-extension

      - name: Smoke exact release archive
        env:
          EXTENSION_PATH: ${{ github.workspace }}/.artifact-extension
        run: pnpm exec playwright test --grep "blob preview embeds"

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Publish stable GitHub release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          .output/*-chrome.zip
          --verify-tag
          --generate-notes
          --title "GitHub HTML Preview $GITHUB_REF_NAME"

      - name: Publish diagnostic GitHub prerelease
        if: ${{ contains(github.ref_name, '-debug.') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          .output/*-chrome.zip
          --verify-tag
          --prerelease
          --title "GitHub HTML Preview $GITHUB_REF_NAME"
          --notes-file .github/release-notes-debug.md
